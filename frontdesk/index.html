<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Front Desk Login — RITS</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../Media/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="css/desk.css">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <img src="../Media/logo.png" alt="Rhode Island Tamil Sangam emblem">
    <h1>Event Front Desk</h1>
    <p>Sign in to check in guests and take event-day payments.</p>
    <div class="login-error" id="login-error" role="alert"></div>
    <form id="login-form">
      <div class="form-row">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username">
      </div>
      <div class="form-row">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:.5rem;">Sign In</button>
    </form>
    <p class="login-footer-note" style="margin-top:1.25rem; font-size:.82rem; color:var(--text-soft);">Need a front-desk login? Ask a board member to create one from the admin dashboard.</p>
  </div>
</div>

<script src="js/config.js"></script>
<script>
  var form = document.getElementById("login-form");
  var errorBox = document.getElementById("login-error");

  if (localStorage.getItem("rits_desk_token")) {
    window.location.href = "desk.html";
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    errorBox.classList.remove("is-visible");

    var username = document.getElementById("username").value.trim();
    var password = document.getElementById("password").value;

    try {
      var res = await fetch(window.RITS_API_BASE + "/auth/desk/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: username, password: password }),
      });
      var data = await res.json();
      if (!res.ok) {
        throw new Error(data.error || "Login failed");
      }
      localStorage.setItem("rits_desk_token", data.token);
      localStorage.setItem("rits_desk_info", JSON.stringify(data.staff));
      window.location.href = "desk.html";
    } catch (err) {
      errorBox.textContent = err.message || "Could not reach the server. Is the backend running?";
      errorBox.classList.add("is-visible");
    }
  });
</script>
</body>
</html>
