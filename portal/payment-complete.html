<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment Status — RITS</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../Media/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="css/portal.css">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <img src="../Media/logo.png" alt="Rhode Island Tamil Sangam emblem">
    <h1 id="status-heading">Confirming Your Payment&hellip;</h1>
    <p id="status-text">Hang tight while we hear back from Square. This usually takes just a few seconds.</p>
    <div class="login-error" id="status-box" role="status"></div>
    <a class="btn btn-primary" href="dashboard.html" style="width:100%; display:none;" id="dashboard-link">Go to My Account</a>
  </div>
</div>

<script src="js/config.js"></script>
<script>
  var token = localStorage.getItem("rits_member_token");
  if (!token) {
    window.location.href = "index.html";
  }

  var params = new URLSearchParams(window.location.search);
  var paymentId = params.get("payment_id");

  var statusHeading = document.getElementById("status-heading");
  var statusText = document.getElementById("status-text");
  var statusBox = document.getElementById("status-box");
  var dashboardLink = document.getElementById("dashboard-link");

  function showResult(kind, heading, text) {
    statusHeading.textContent = heading;
    statusText.textContent = text;
    statusBox.classList.add("is-visible");
    if (kind === "success") {
      statusBox.style.background = "color-mix(in srgb, var(--green) 14%, transparent)";
      statusBox.style.color = "var(--green)";
      statusBox.textContent = "Payment confirmed — thank you!";
    } else if (kind === "pending") {
      statusBox.style.background = "color-mix(in srgb, var(--gold) 20%, transparent)";
      statusBox.style.color = "#8a5a00";
      statusBox.textContent = "Still waiting on confirmation from Square.";
    } else {
      statusBox.style.background = "";
      statusBox.style.color = "";
      statusBox.textContent = text;
    }
    dashboardLink.style.display = "";
  }

  async function checkStatus() {
    try {
      var res = await fetch(window.RITS_API_BASE + "/payments/me", {
        headers: { Authorization: "Bearer " + token },
      });
      if (res.status === 401) {
        window.location.href = "index.html";
        return "stop";
      }
      var data = await res.json();
      var payment = data.payments.find(function (p) { return p.id === paymentId; });

      if (!payment) return "keep-polling";
      if (payment.status === "completed") {
        var message = payment.purpose === "event"
          ? "You're registered for " + (payment.event_name || "the event") + "! Thank you."
          : "Your membership is now marked paid. Thank you for supporting RITS.";
        showResult("success", "Payment Confirmed!", message);
        return "stop";
      }
      if (payment.status === "failed" || payment.status === "cancelled") {
        showResult("error", "Payment Not Completed", "It looks like the payment didn't go through (" + payment.status + "). No charge should have been made — feel free to try again from your account page.");
        return "stop";
      }
      return "keep-polling";
    } catch (err) {
      return "keep-polling";
    }
  }

  (async function poll() {
    if (!paymentId) {
      showResult("error", "Missing Payment Info", "This page was opened without a payment reference. If you just paid, check your account page — it may already be updated.");
      return;
    }

    var attempts = 0;
    var maxAttempts = 15; // ~30s at 2s intervals
    var interval = setInterval(async function () {
      attempts++;
      var result = await checkStatus();
      if (result === "stop") {
        clearInterval(interval);
      } else if (attempts >= maxAttempts) {
        clearInterval(interval);
        showResult(
          "pending",
          "Still Confirming…",
          "This is taking longer than usual. Your payment may still be processing — check your account page in a few minutes, or contact the board if this doesn't update."
        );
      }
    }, 2000);
  })();
</script>
</body>
</html>
