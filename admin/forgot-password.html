<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot Password — RITS Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../Media/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <img src="../Media/logo.png" alt="Rhode Island Tamil Sangam emblem">
    <h1>Reset Your Password</h1>
    <p>Enter the email on your admin login and we'll send you a reset link.</p>
    <div class="login-error" id="form-message" role="status"></div>
    <form id="forgot-form">
      <div class="form-row">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username">
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn" style="width:100%; margin-top:.5rem;">Send Reset Link</button>
    </form>
    <p class="login-footer-note"><a href="index.html">Back to sign in</a></p>
  </div>
</div>

<script src="js/config.js"></script>
<script>
  var form = document.getElementById("forgot-form");
  var messageBox = document.getElementById("form-message");
  var submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    messageBox.classList.remove("is-visible");
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending…";

    var email = document.getElementById("email").value.trim();

    try {
      var res = await fetch(window.RITS_API_BASE + "/auth/admin/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email }),
      });
      var data = await res.json().catch(function () { return {}; });

      messageBox.textContent = data.message || "If that email is registered as an admin login, we've sent a password reset link.";
      messageBox.style.background = "color-mix(in srgb, var(--green) 14%, transparent)";
      messageBox.style.color = "var(--green)";
      messageBox.classList.add("is-visible");
      form.reset();
    } catch (err) {
      messageBox.textContent = "Couldn't reach the server. Please try again later.";
      messageBox.style.background = "";
      messageBox.style.color = "";
      messageBox.classList.add("is-visible");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Send Reset Link";
    }
  });
</script>
</body>
</html>
