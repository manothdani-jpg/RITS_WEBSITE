<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set New Password — RITS Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../Media/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <img src="../Media/logo.png" alt="Rhode Island Tamil Sangam emblem">
    <h1>Set a New Password</h1>
    <p id="intro-text">Choose a new password for your admin dashboard login.</p>
    <div class="login-error" id="form-message" role="status"></div>

    <form id="reset-form">
      <div class="form-row">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
      </div>
      <div class="form-row">
        <label for="confirm">Confirm new password</label>
        <input type="password" id="confirm" name="confirm" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn" style="width:100%; margin-top:.5rem;">Set Password</button>
    </form>
    <p class="login-footer-note"><a href="index.html">Back to sign in</a></p>
  </div>
</div>

<script src="js/config.js"></script>
<script>
  var params = new URLSearchParams(window.location.search);
  var email = params.get("email") || "";
  var token = params.get("token") || "";

  var form = document.getElementById("reset-form");
  var messageBox = document.getElementById("form-message");
  var submitBtn = document.getElementById("submit-btn");

  function showMessage(text, kind) {
    messageBox.textContent = text;
    if (kind === "success") {
      messageBox.style.background = "color-mix(in srgb, var(--green) 14%, transparent)";
      messageBox.style.color = "var(--green)";
    } else {
      messageBox.style.background = "";
      messageBox.style.color = "";
    }
    messageBox.classList.add("is-visible");
  }

  if (!email || !token) {
    document.getElementById("intro-text").textContent = "This reset link is missing information.";
    showMessage("This link looks incomplete. Please request a new password reset.", "error");
    form.style.display = "none";
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    messageBox.classList.remove("is-visible");

    var password = document.getElementById("password").value;
    var confirm = document.getElementById("confirm").value;

    if (password !== confirm) {
      showMessage("Those passwords don't match.", "error");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Saving…";

    try {
      var res = await fetch(window.RITS_API_BASE + "/auth/admin/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, token: token, password: password }),
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(data.error || "Could not reset password.");

      showMessage("Password updated! Redirecting you to sign in…", "success");
      form.style.display = "none";
      setTimeout(function () { window.location.href = "index.html"; }, 1800);
    } catch (err) {
      showMessage(err.message, "error");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Set Password";
    }
  });
</script>
</body>
</html>
