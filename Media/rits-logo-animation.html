<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rhode Island Tamil Sangam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600;700&family=Noto+Sans+Tamil:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --ink:#1c130c;
    --maroon:#7a1b3a;
    --gold:#e2a13a;
    --gold-bright:#ffd479;
    --teal:#1c5b70;
    --green:#3c8f5f;
    --cream:#fbf1de;
    --stage-1:#2b160e;
    --stage-2:#160c08;
    --text-strong:#fbeed8;
    --text-soft:#d8b98d;
    --rule:#c98a35;
  }

  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --stage-1:#fdf3df;
      --stage-2:#f3e1bd;
      --text-strong:#3a2313;
      --text-soft:#7a5a34;
      --rule:#b9782b;
    }
  }
  :root[data-theme="light"]{
    --stage-1:#fdf3df;
    --stage-2:#f3e1bd;
    --text-strong:#3a2313;
    --text-soft:#7a5a34;
    --rule:#b9782b;
  }
  :root[data-theme="dark"]{
    --stage-1:#2b160e;
    --stage-2:#160c08;
    --text-strong:#fbeed8;
    --text-soft:#d8b98d;
    --rule:#c98a35;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background: radial-gradient(120% 120% at 50% 38%, var(--stage-1) 0%, var(--stage-2) 72%);
    color:var(--text-strong);
    font-family:"Work Sans", ui-sans-serif, system-ui, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .stage{
    position:relative;
    width:min(92vw, 640px);
    padding: 6vh 0 4vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  /* ---------- ambient sunburst behind the badge ---------- */
  .sunburst{
    position:absolute;
    top:50%; left:50%;
    width:min(150vw, 1100px);
    height:min(150vw, 1100px);
    transform:translate(-50%,-58%) rotate(0deg);
    background: repeating-conic-gradient(
      from 0deg,
      color-mix(in srgb, var(--gold) 22%, transparent) 0deg 4deg,
      transparent 4deg 16deg
    );
    -webkit-mask-image: radial-gradient(circle, black 30%, transparent 68%);
    mask-image: radial-gradient(circle, black 30%, transparent 68%);
    opacity:.55;
    animation: spin 90s linear infinite;
    pointer-events:none;
    z-index:0;
  }
  .sunburst.reverse{
    width:min(120vw, 900px);
    height:min(120vw, 900px);
    animation: spin-reverse 70s linear infinite;
    opacity:.35;
  }
  @keyframes spin{ to{ transform:translate(-50%,-58%) rotate(360deg); } }
  @keyframes spin-reverse{ to{ transform:translate(-50%,-58%) rotate(-360deg); } }

  /* ---------- particle sparks orbiting the badge ---------- */
  .sparks{ position:absolute; inset:0; z-index:1; pointer-events:none; }
  .spark{
    position:absolute;
    top:50%; left:50%;
    width:5px; height:5px;
    border-radius:50%;
    background:var(--gold-bright);
    box-shadow:0 0 6px 2px color-mix(in srgb, var(--gold-bright) 70%, transparent);
    opacity:0;
    animation: spark-life 5.5s ease-in-out infinite;
  }

  @keyframes spark-life{
    0%{ opacity:0; transform: translate(-50%,-50%) rotate(var(--a)) translateX(var(--r)) scale(.4); }
    12%{ opacity:.95; }
    50%{ opacity:.55; transform: translate(-50%,-50%) rotate(calc(var(--a) + 8deg)) translateX(calc(var(--r) + 6px)) scale(1); }
    88%{ opacity:.85; }
    100%{ opacity:0; transform: translate(-50%,-50%) rotate(calc(var(--a) + 16deg)) translateX(var(--r)) scale(.4); }
  }

  /* ---------- badge ---------- */
  .badge-wrap{
    position:relative;
    z-index:2;
    width:min(58vw, 340px);
    aspect-ratio:1/1;
    opacity:0;
    transform: scale(.4) rotate(-10deg);
    animation: badge-enter 1.15s cubic-bezier(.2,.9,.25,1.25) .15s forwards,
               badge-float 4.6s ease-in-out 1.3s infinite;
  }
  @keyframes badge-enter{
    0%{ opacity:0; transform: scale(.4) rotate(-10deg); }
    60%{ opacity:1; transform: scale(1.06) rotate(1.5deg); }
    100%{ opacity:1; transform: scale(1) rotate(0deg); }
  }
  @keyframes badge-float{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-8px); }
  }

  .badge-glow{
    position:absolute;
    inset:-6%;
    border-radius:50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--gold) 55%, transparent) 0%, transparent 65%);
    filter: blur(18px);
    animation: glow-breathe 3.2s ease-in-out 1.2s infinite;
    z-index:0;
  }
  @keyframes glow-breathe{
    0%,100%{ opacity:.45; transform:scale(.96); }
    50%{ opacity:.85; transform:scale(1.04); }
  }

  .ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    border:2px solid var(--gold-bright);
    opacity:0;
    animation: ring-pulse 1.4s ease-out 1.05s 1;
  }
  @keyframes ring-pulse{
    0%{ opacity:.9; transform:scale(.72); }
    100%{ opacity:0; transform:scale(1.55); }
  }

  .badge-img{
    position:relative;
    z-index:1;
    width:100%; height:100%;
    display:block;
    filter: drop-shadow(0 10px 26px rgba(0,0,0,.45));
  }

  .shine{
    position:absolute;
    inset:0;
    z-index:2;
    overflow:hidden;
    border-radius:50%;
    pointer-events:none;
  }
  .shine::before{
    content:"";
    position:absolute;
    top:-30%; left:-160%;
    width:22%; height:180%;
    background:linear-gradient(75deg, transparent 0%, color-mix(in srgb, var(--gold-bright) 65%, white) 50%, transparent 100%);
    opacity:.4;
    mix-blend-mode:soft-light;
    animation: sweep 6.5s ease-in-out 1.9s infinite;
  }
  @keyframes sweep{
    0%, 22%{ left:-160%; }
    40%, 100%{ left:180%; }
  }

  /* ---------- caption ---------- */
  .caption{
    position:relative;
    z-index:2;
    margin-top:clamp(18px, 3.5vh, 34px);
    text-align:center;
  }

  .name{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:.02em;
    font-family:"Cormorant SC", "Noto Serif", serif;
    font-weight:600;
    font-size:clamp(1.15rem, 2.6vw, 1.55rem);
    letter-spacing:.16em;
    color:var(--text-strong);
    text-transform:uppercase;
  }
  .name span{
    display:inline-block;
    opacity:0;
    transform:translateY(10px);
    animation: letter-in .6s ease-out forwards;
  }

  @keyframes letter-in{
    to{ opacity:1; transform:translateY(0); }
  }

  .rule{
    width:0;
    height:1px;
    margin:14px auto;
    background: linear-gradient(90deg, transparent, var(--rule), transparent);
    animation: rule-grow 1s ease-out 2.15s forwards;
  }
  @keyframes rule-grow{ to{ width:min(70%, 260px); } }

  .tamil-line{
    font-family:"Noto Sans Tamil", sans-serif;
    font-weight:600;
    font-size:clamp(1rem, 2.4vw, 1.25rem);
    color:var(--gold);
    opacity:0;
    animation: fade-up .8s ease-out 2.5s forwards;
  }
  @keyframes fade-up{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .sub{
    margin-top:6px;
    font-size:.8rem;
    letter-spacing:.08em;
    color:var(--text-soft);
    opacity:0;
    animation: fade-up .8s ease-out 2.75s forwards;
  }

  @media (prefers-reduced-motion: reduce){
    .sunburst, .sunburst.reverse, .badge-wrap, .badge-glow, .shine::before, .spark{
      animation: none !important;
    }
    .badge-wrap{ opacity:1; transform:none; }
    .name span{ opacity:1; transform:none; }
    .rule{ width:min(70%,260px); }
    .tamil-line, .sub{ opacity:1; transform:none; }
    .ring{ display:none; }
  }
</style>
</head>

<script>
  // Stagger the name letters
  var text = "Rhode Island Tamil Sangam";
  var host = document.getElementById('name');
  var delay = 1.55;
  text.split('').forEach(function(ch){
    var s = document.createElement('span');
    s.textContent = ch === ' ' ? ' ' : ch;
    s.style.animationDelay = delay.toFixed(2) + 's';
    host.appendChild(s);
    delay += 0.028;
  });

  // Scatter sparks around the badge ring
  var sparkHost = document.getElementById('sparks');
  var n = 14;
  for (var i = 0; i < n; i++){
    var el = document.createElement('div');
    el.className = 'spark';
    var angle = (360 / n) * i;
    var radius = 150 + (i % 3) * 22;
    el.style.setProperty('--a', angle + 'deg');
    el.style.setProperty('--r', radius + 'px');
    el.style.animationDelay = (i * 0.4).toFixed(2) + 's';
    sparkHost.appendChild(el);
  }
</script>
